    <script>
        // Data URI SVG icon matching the header branding with blue background and gradient
        const svgIconStr = `<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"><defs><linearGradient id="grad" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#4f46e5"/><stop offset="100%" stop-color="#2563eb"/></linearGradient></defs><rect width="512" height="512" rx="110" fill="url(#grad)"/><g fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" transform="translate(96, 96) scale(13.33)"><path d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></g></svg>`;
        const iconDataUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgIconStr);

        const manifestObj = {
            "name": "ATM Tracker Pro",
            "short_name": "ATMTracker",
            "start_url": "./",
            "display": "standalone",
            "background_color": "#2563eb",
            "theme_color": "#2563eb",
            "icons": [{
                "src": iconDataUrl,
                "sizes": "512x512",
                "type": "image/svg+xml",
                "purpose": "any maskable"
            }]
        };
        const manifestBlobUrl = URL.createObjectURL(new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' }));
        
        document.addEventListener('DOMContentLoaded', () => {
            const mLink = document.createElement('link');
            mLink.rel = 'manifest';
            mLink.href = manifestBlobUrl;
            document.head.appendChild(mLink);

            const appleIcon = document.createElement('link');
            appleIcon.rel = 'apple-touch-icon';
            appleIcon.href = iconDataUrl;
            document.head.appendChild(appleIcon);

            if ('serviceWorker' in navigator) {
                const swCode = `
                    self.addEventListener('install', (e) => self.skipWaiting());
                    self.addEventListener('activate', (e) => clients.claim());
                    self.addEventListener('fetch', (e) => {
                        e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
                    });
                `;
                const swBlob = new Blob([swCode], { type: 'text/javascript' });
                navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(err => console.log('SW registration error:', err));
            }
        });
    </script>

        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

            .no-print { display: none !important; }
            .print-break { page-break-inside: avoid; margin-bottom: 15px; border: 1px solid #ccc; padding: 8px; }

        .editable-active { border: 1px dashed #3b82f6; background-color: #eff6ff; padding: 4px; border-radius: 4px; outline: none; }

        function showConfirm(title, message, onConfirm) {
            document.getElementById('confirmTitle').innerText = title;
            document.getElementById('confirmMessage').innerText = message;
            const modal = document.getElementById('confirmModal');
            modal.classList.remove('hidden');

            const okBtn = document.getElementById('confirmOkBtn');
            const cancelBtn = document.getElementById('confirmCancelBtn');

            const newOkBtn = okBtn.cloneNode(true);
            const newCancelBtn = cancelBtn.cloneNode(true);
            okBtn.parentNode.replaceChild(newOkBtn, okBtn);
            cancelBtn.parentNode.replaceChild(newCancelBtn, cancelBtn);

            newOkBtn.onclick = () => {
                modal.classList.add('hidden');
                onConfirm(true);
            };
            newCancelBtn.onclick = () => {
                modal.classList.add('hidden');
                onConfirm(false);
            };
        }

            const atm = ATMs.find(a => a.id === id);
            if(atm) {
                atm.remarks = val;
                saveState();
            }
        }

        function toggleEdit(id) {
            if(editingId === id) {
                showConfirm("Save Changes?", "Do you want to save the edited details for this ATM?", (confirmed) => {
                    if (confirmed) {
                        const atm = ATMs.find(a => a.id === id);
                        atm.building = document.getElementById(`edit-bldg-${id}`).innerText;
                        atm.area = document.getElementById(`edit-area-${id}`).innerText;
                        atm.landmark = document.getElementById(`edit-lnd-${id}`).innerText;
                        atm.lat = document.getElementById(`edit-lat-${id}`).innerText;
                        atm.lng = document.getElementById(`edit-lng-${id}`).innerText;
                        atm.mapLink = document.getElementById(`edit-maplink-${id}`).value.trim();
                        atm.atmType = document.getElementById(`edit-atmtype-${id}`).value;
                        atm.phase = document.getElementById(`edit-phase-${id}`).value;
                        atm.ramp = document.getElementById(`edit-ramp-${id}`).value;
                        atm.shutter = document.getElementById(`edit-shutter-${id}`).value;
                        atm.caretaker = document.getElementById(`edit-caretaker-${id}`).value;
                        atm.esurv = document.getElementById(`edit-esurv-${id}`).value;
                        
                        const vendorEl = document.getElementById(`edit-vendor-${id}`);
                        let vVal = vendorEl.value;
                        if(vVal === 'Custom') {
                            vVal = document.getElementById(`edit-vendor-custom-${id}`).value.trim() || 'Custom';
                        }
                        atm.vendor = vVal;

                        const custodianRows = document.querySelectorAll(`.custodian-row-${id}`);
                        let updatedCustodians = [];
                        custodianRows.forEach(row => {
                            let role = row.querySelector('.cust-role').value;
                            if(role === 'Custom') {
                                role = row.querySelector('.cust-role-custom').value.trim() || 'Custom';
                            }
                            const name = row.querySelector('.cust-name').value;
                            const number = row.querySelector('.cust-number').value;
                            if(name.trim() !== '' || number.trim() !== '') updatedCustodians.push({role, name, number});
                        });
                        atm.custodians = updatedCustodians;

                        saveState();
                        editingId = null;
                        showToast("Details Saved Successfully!");
                        renderApp();
                    } else {
                        showConfirm("Discard Edits?", "Are you sure you want to discard your changes?", (discardConfirmed) => {
                            if(discardConfirmed) {
                                editingId = null;
                                renderApp();
                                showToast("Edit discarded.");
                            }
                        });
                    }
                });
            } else {
                showConfirm("Start Editing?", "You are entering edit mode for this ATM.", (confirmed) => {
                    if (confirmed) {
                        editingId = id;
                        renderApp();
                    }
                });
            }
        }

        function addCustodian(id) {
            const atm = ATMs.find(a => a.id === id);
            if(atm) {
                atm.custodians.push({role: 'Service Manager', name: '', number: ''});
                renderApp();
            }
        }

        function removeCustodian(id, index) {
            const atm = ATMs.find(a => a.id === id);
            if(!atm) return;

            showConfirm("Delete Custodian", "Choose 'Confirm' to delete from ALL ATMs in this branch, or 'Cancel' to delete from current ATM only.", (allBranch) => {
                if (allBranch) {
                    const targetRole = atm.custodians[index].role;
                    const targetName = atm.custodians[index].name;
                    const targetNum = atm.custodians[index].number;
                    ATMs.forEach(a => {
                        if (a.branchCode === atm.branchCode) {
                            a.custodians = a.custodians.filter(c => !(c.role === targetRole && c.name === targetName && c.number === targetNum));
                        }
                    });
                    showToast(`Deleted from all ATMs in branch ${atm.branchCode}!`);
                } else {
                    atm.custodians.splice(index, 1);
                    showToast("Deleted from current ATM!");
                }
                saveState();
                renderApp();
            });
        }

        function copyCustodiansToBranch(id) {
            const sourceAtm = ATMs.find(a => a.id === id);
            if (!sourceAtm || sourceAtm.custodians.length === 0) {
                showToast("No custodians to copy!");
                return;
            }
            showConfirm("Copy Custodians?", `Copy these ${sourceAtm.custodians.length} custodian(s) to all ATMs under branch code ${sourceAtm.branchCode}?`, (confirmed) => {
                if (confirmed) {
                    let count = 0;
                    ATMs.forEach(atm => {
                        if (atm.branchCode === sourceAtm.branchCode) {
                            atm.custodians = JSON.parse(JSON.stringify(sourceAtm.custodians));
                            count++;
                        }
                    });
                    saveState();
                    renderApp();
                    showToast(`Copied to ${count} ATMs in branch ${sourceAtm.branchCode}!`);
                }
            });
        }

        function handleRoleChange(selectEl, id) {
            const customInput = document.getElementById(`cust-custom-${id}-${selectEl.dataset.index}`);
            if(selectEl.value === 'Custom') {
                customInput.classList.remove('hidden');
            } else {
                customInput.classList.add('hidden');
            }
        }

        function addCustomRoleFromButton(selectId, customInputId) {
            const selectEl = document.getElementById(selectId);
            const customInput = document.getElementById(customInputId);
            selectEl.value = 'Custom';
            customInput.classList.remove('hidden');
            customInput.focus();
        }

        function handleVendorChange(selectEl, id) {
            const customInput = document.getElementById(`vendor-custom-${id}`);
            if(selectEl.value === 'Custom') {
                customInput.classList.remove('hidden');
            } else {
                customInput.classList.add('hidden');
            }
        }

            exportMode = mode;

                { id: 'sheetSrNo', label: 'Sheet Sr No', checked: true },

                { id: 'category', label: 'Category', checked: true },
                { id: 'status', label: 'Status', checked: true },
                { id: 'building', label: 'Building', checked: true },
                { id: 'area', label: 'Area', checked: true },
                { id: 'landmark', label: 'Landmark', checked: true },
                { id: 'latlng', label: 'Latitude / Longitude', checked: true },
                { id: 'mapLink', label: 'Map Link', checked: true },
                { id: 'ramp', label: 'Ramp', checked: true },
                { id: 'shutter', label: 'Shutter', checked: true },
                { id: 'caretaker', label: 'Caretaker', checked: true },
                { id: 'esurv', label: 'E-Surveillance', checked: true },
                { id: 'custodians', label: 'Custodians & Contacts', checked: true },
                { id: 'remarks', label: 'Remarks', checked: true }

            container.innerHTML = '';

                label.innerHTML = `<input type="checkbox" class="export-col-cb" value="${col.id}" ${col.checked ? 'checked' : ''}> ${col.label}`;
                container.appendChild(label);
            });

            document.getElementById('exportModal').classList.remove('hidden');
        }

        function closeExportModal() {
            document.getElementById('exportModal').classList.add('hidden');
        }

        function confirmExport() {
            closeExportModal();
            const selectedCols = Array.from(document.querySelectorAll('.export-col-cb:checked')).map(cb => cb.value);
            if(exportMode === 'excel') {
                exportExcelCustom(selectedCols);

                exportPDFCustom(selectedCols);

                            <div class="mb-3">
                                <a href="${mapUrl}" target="_blank" class="block w-full text-center py-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 rounded font-semibold text-[11px] transition-colors flex items-center justify-center gap-1">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                    View on Google Map
                                </a>
                                ${mapLinkField}
                            </div>

                            ${custodiansHtml}

                            <div class="mb-3">
                                ${isEditing ? `
                                    <input type="text" 
                                        class="w-full text-xs p-2 border border-slate-300 rounded focus:ring-1 focus:ring-blue-500 focus:outline-none bg-slate-50" 
                                        placeholder="Enter remarks here..." 
                                        value="${atm.remarks}"
                                        oninput="updateRemark('${atm.id}', this.value)">
                                ` : `
                                    <div class="text-[11px] p-2 bg-slate-50 rounded border border-slate-100 text-slate-700">
                                        <span class="font-semibold text-slate-400 block text-[9px] uppercase mb-0.5">Remarks:</span>
                                        ${atm.remarks ? atm.remarks : '<span class="text-slate-400 italic">No remarks</span>'}
                                    </div>
                                `}
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-2 mt-auto no-print">
                            <button onclick="toggleEdit('${atm.id}')" class="py-2 rounded-lg text-xs font-semibold transition-colors ${isEditing ? 'bg-indigo-600 text-white hover:bg-indigo-700 shadow-sm' : 'bg-slate-100 text-slate-700 hover:bg-slate-200 border border-slate-200'}">
                                ${isEditing ? '💾 Save' : '✏️ Edit'}
                            </button>
                            <button onclick="toggleStatus('${atm.id}')" class="py-2 rounded-lg text-xs font-semibold transition-colors ${isComp ? 'bg-amber-100 text-amber-700 hover:bg-amber-200 border border-amber-200' : 'bg-blue-600 text-white hover:bg-blue-700 shadow-sm'}">
                                ${isComp ? '↺ Pending' : '✓ Complete'}
                            </button>
                        </div>
                    </div>
                `;
            });
            
            html += `</div></div>`;
            return html;
        }

        function renderApp() {
            const searchQ = document.getElementById('searchInput').value.toLowerCase();
            
            let fullyFiltered = ATMs.filter(a => {
                if(activeFilters.status.length > 0 && !activeFilters.status.includes(a.status)) return false;
                if(activeFilters.category.length > 0 && !activeFilters.category.includes(a.category)) return false;
                if(activeFilters.branches.length > 0 && !activeFilters.branches.includes(a.branchCode)) return false;
                if(activeFilters.custRoles.length > 0) {
                    const hasRole = a.custodians.some(c => activeFilters.custRoles.includes(c.role));
                    if(!hasRole) return false;
                }
                return true;
            });

            const countAll = fullyFiltered.length;
            const countCompleted = fullyFiltered.filter(a => a.status === 'completed').length;
            const countPending = countAll - countCompleted;
            
            document.getElementById('count-all').innerText = countAll;
            document.getElementById('count-pending').innerText = countPending;
            document.getElementById('count-completed').innerText = countCompleted;

            let displayData = fullyFiltered.filter(a => 
                a.id.toLowerCase().includes(searchQ) || 
                a.area.toLowerCase().includes(searchQ) || 
                a.landmark.toLowerCase().includes(searchQ) ||
                a.building.toLowerCase().includes(searchQ) ||
                a.branchName.toLowerCase().includes(searchQ) ||
                a.branchCode.toLowerCase().includes(searchQ) ||
                a.vendor.toLowerCase().includes(searchQ)
            );

            if (currentTab === 'pending') displayData = displayData.filter(a => a.status === 'pending');
            if (currentTab === 'completed') displayData = displayData.filter(a => a.status === 'completed');

            currentFilteredATMs = displayData;

            const matched = displayData.filter(a => a.category === 'matched' && a.branchName !== "Branch Not Found");
            const notMatched = displayData.filter(a => a.category === 'not-matched' && a.branchName !== "Branch Not Found");
            const nonAlloted = displayData.filter(a => a.category === 'non-alloted' && a.branchName !== "Branch Not Found");
            const unknownBranch = displayData.filter(a => a.branchName === "Branch Not Found");

            const container = document.getElementById('mainContainer');
            let htmlString = '';
            htmlString += buildSection('✅ Alloted / Matched ATMs', matched, 'bg-emerald-100 border border-emerald-200');
            htmlString += buildSection('❌ Not Matched ATMs', notMatched, 'bg-red-100 border border-red-200');
            htmlString += buildSection('⚠️ Non-Alloted ATMs', nonAlloted, 'bg-amber-100 border border-amber-200');
            htmlString += buildSection('❓ Unknown Branch ATMs', unknownBranch, 'bg-slate-200 border border-slate-300');

            if(displayData.length === 0) {
                htmlString = `<div class="text-center py-12 text-slate-400 font-medium text-sm border-2 border-dashed border-slate-200 rounded-xl">No ATMs found matching your filters.</div>`;
            }

            container.innerHTML = htmlString;
        }

        function exportExcelCustom(selectedCols) {
            const catOrder = { 'matched': 1, 'not-matched': 2, 'non-alloted': 3 };
            let exportData = [...currentFilteredATMs].sort((a, b) => (catOrder[a.category] || 99) - (catOrder[b.category] || 99));

            const colMap = {
                'srNo': 'Total Sr No',
                'sheetSrNo': 'Sheet Sr No',
                'atmId': 'ATM ID',
                'atmType': 'ATM Type',
                'vendor': 'Vendor Company',
                'phase': 'Phase',
                'branch': 'Branch',
                'category': 'Category',
                'status': 'Status',
                'building': 'Building',
                'area': 'Area',
                'landmark': 'Landmark',
                'latlng': 'Latitude / Longitude',
                'mapLink': 'Map Link',
                'ramp': 'Ramp',
                'shutter': 'Shutter',
                'caretaker': 'Caretaker',
                'esurv': 'E-Surveillance',
                'custodians': 'Custodians',
                'remarks': 'Remarks'
            };

            let headers = selectedCols.map(c => colMap[c]);
            let csvContent = "data:text/csv;charset=utf-8,ATM LIST\n" + headers.join(",") + "\n";
            
            exportData.forEach((atm, idx) => {
                const custStr = atm.custodians.map(c => `${c.role}: ${c.name} (${c.number})`).join(' | ');
                const rowObj = {
                    'srNo': idx + 1,
                    'sheetSrNo': atm.srNo,
                    'atmId': atm.id,
                    'atmType': atm.atmType,
                    'vendor': atm.vendor,
                    'phase': atm.phase,
                    'branch': `"${atm.branchCode} - ${atm.branchName}"`,
                    'category': atm.category,
                    'status': atm.status,
                    'building': `"${atm.building.replace(/"/g, '""')}"`,
                    'area': `"${atm.area.replace(/"/g, '""')}"`,
                    'landmark': `"${atm.landmark.replace(/"/g, '""')}"`,
                    'latlng': `"${atm.lat}, ${atm.lng}"`,
                    'mapLink': `"${atm.mapLink || ''}"`,
                    'ramp': atm.ramp,
                    'shutter': atm.shutter,
                    'caretaker': atm.caretaker,
                    'esurv': atm.esurv,
                    'custodians': `"${custStr}"`,
                    'remarks': `"${atm.remarks.replace(/"/g, '""')}"`
                };

                let row = selectedCols.map(c => rowObj[c]);
                csvContent += row.join(",") + "\n";
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `ATM_List_Report_${new Date().toLocaleDateString()}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast("Excel Exported!");
        }

        function exportPDFCustom(selectedCols) {
            if(!window.jspdf) {
                alert("PDF Library is still loading. Please try again.");
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('landscape');

            doc.setFontSize(14);
            doc.setTextColor(30, 41, 59);
            doc.text("ATM LIST", 14, 12);
            doc.setFontSize(8);
            doc.setTextColor(100, 100, 100);
            doc.text(`Generated on: ${new Date().toLocaleString()}`, 14, 17);
            
            const catOrder = { 'matched': 1, 'not-matched': 2, 'non-alloted': 3 };
            let exportData = [...currentFilteredATMs].sort((a, b) => (catOrder[a.category] || 99) - (catOrder[b.category] || 99));

            const colMap = {
                'srNo': 'Tot.Sr',
                'sheetSrNo': 'Sht.Sr',
                'atmId': 'ATM ID',
                'atmType': 'Type',
                'vendor': 'Vendor',
                'phase': 'Phase',
                'branch': 'Branch',
                'category': 'Category',
                'status': 'Status',
                'building': 'Building',
                'area': 'Area',
                'landmark': 'Landmark',
                'latlng': 'Lat / Lng',
                'mapLink': 'Map Link',
                'ramp': 'Ramp',
                'shutter': 'Shutter',
                'caretaker': 'Caretaker',
                'esurv': 'E-Surv',
                'custodians': 'Custodians',
                'remarks': 'Remarks'
            };

            const head = [selectedCols.map(c => colMap[c])];
            const body = exportData.map((atm, i) => {
                const custStr = atm.custodians.map(c => `${c.role}: ${c.name} (${c.number})`).join('\n');
                const rowObj = {
                    'srNo': i + 1,
                    'sheetSrNo': atm.srNo,
                    'atmId': atm.id,
                    'atmType': atm.atmType,
                    'vendor': atm.vendor,
                    'phase': atm.phase,
                    'branch': `${atm.branchCode}\n${atm.branchName}`,
                    'category': atm.category,
                    'status': atm.status,
                    'building': atm.building,
                    'area': atm.area,
                    'landmark': atm.landmark,
                    'latlng': `${atm.lat}, ${atm.lng}`,
                    'mapLink': atm.mapLink || '',
                    'ramp': atm.ramp,
                    'shutter': atm.shutter,
                    'caretaker': atm.caretaker,
                    'esurv': atm.esurv,
                    'custodians': custStr,
                    'remarks': atm.remarks
                };
                return selectedCols.map(c => rowObj[c]);
            });

            doc.autoTable({
                startY: 20,
                head: head,
                body: body,
                theme: 'grid',
                styles: { 
                    fontSize: 6.5, 
                    cellPadding: 1.5, 
                    overflow: 'linebreak', 
                    fillColor: [255, 255, 255],
                    textColor: [40, 40, 40] 
                },
                headStyles: { 
                    fillColor: [100, 116, 139],
                    textColor: [255, 255, 255],
                    fontStyle: 'bold',
                    halign: 'center'
                },
                alternateRowStyles: { 
                    fillColor: [255, 255, 255]
                },
                didParseCell: function (data) {
                    const catIndex = selectedCols.indexOf('category');
                    if (catIndex !== -1 && data.section === 'body' && data.column.index === catIndex) {
                        const category = data.cell.raw;
                        if (category === 'non-alloted') {
                            data.cell.styles.textColor = [220, 38, 38];
                            data.cell.styles.fontStyle = 'bold';
                        } else if (category === 'not-matched') {
                            data.cell.styles.textColor = [234, 88, 12];
                            data.cell.styles.fontStyle = 'bold';
                        } else if (category === 'matched') {
                            data.cell.styles.textColor = [22, 163, 74];
                            data.cell.styles.fontStyle = 'bold';
                        }
                    }
                }
            });

            doc.save(`ATM_List_Report_${new Date().toLocaleDateString()}.pdf`);
            showToast("PDF Downloaded Successfully!");
        }

        renderApp();
    </script>
</body>
</html>
